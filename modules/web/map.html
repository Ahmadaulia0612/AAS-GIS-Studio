<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="leaflet.css">
    <script src="leaflet.js"></script>
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script>
        // 1. Inisialisasi Peta
        var map = L.map('map').setView([-0.789275, 113.921327], 5);

        // 2. Tambahkan Basemap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 3. Definisikan Custom Icon Merah (Inline SVG - Tidak perlu file eksternal)
        var redPinSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#d32f2f" stroke="#ffffff" stroke-width="1"/></svg>';
        var redPinUrl = 'data:image/svg+xml;base64,' + btoa(redPinSVG);

        var redPinIcon = L.icon({
            iconUrl: redPinUrl,
            iconSize: [40, 40],
            iconAnchor: [20, 40],
            popupAnchor: [0, -40]
        });

        var outletMarker = null;

        // 4. Logika klik pada peta
        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            // Hapus marker lama
            if (outletMarker !== null) {
                map.removeLayer(outletMarker);
            }

            // Pasang marker baru
            outletMarker = L.marker([lat, lng], {icon: redPinIcon}).addTo(map);

            // Kirim koordinat ke Python
            if (typeof backend !== 'undefined') {
                backend.receiveOutletCoords(lat, lng);
            } else {
                console.log("Koordinat: " + lat + ", " + lng);
            }
        });
    </script>
</body>

</html>
