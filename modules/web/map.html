<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8"/>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

html,
body,
#map{

margin:0;

width:100%;

height:100%;

}

</style>

</head>

<body>

<div id="map"></div>

<script>

var map = L.map('map').setView(
[-2.5,118],
5
);

L.tileLayer(

'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

{

maxZoom:19

}

).addTo(map);

</script>

</body>

</html>
