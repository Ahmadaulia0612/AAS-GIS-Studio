<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Wajib ada untuk komunikasi JavaScript ke Python PySide6 -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script>
        // 1. Inisialisasi Peta
        var map = L.map('map').setView([-0.789275, 113.921327], 5);

        // 2. Tambahkan Basemap OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 3. Inisialisasi QWebChannel untuk koneksi ke Python
        var backend = null;
        if (typeof qt !== 'undefined') {
            new QWebChannel(qt.webChannelTransport, function (channel) {
                backend = channel.objects.backend;
                console.log("QWebChannel berhasil terhubung ke Python!");
            });
        } else {
            console.log("QWebChannel tidak tersedia (dijalankan di luar browser PyQt).");
        }

        // 4. Custom Icon Merah untuk Outlet (Inline SVG)
        var redPinSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#d32f2f" stroke="#ffffff" stroke-width="1"/></svg>';
        var redPinUrl = 'data:image/svg+xml;base64,' + btoa(redPinSVG);

        var redPinIcon = L.icon({
            iconUrl: redPinUrl,
            iconSize: [40, 40],
            iconAnchor: [20, 40],
            popupAnchor: [0, -40]
        });

        var outletMarker = null;
        var demBoundsLayer = null; // Layer untuk kotak batas DEM
        var riverLayerGroup = L.layerGroup().addTo(map);
        var watershedLayerGroup = L.layerGroup().addTo(map);

        // 5. Logika Klik Peta (Pilih Outlet & Kirim ke Python)
        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            if (outletMarker !== null) {
                map.removeLayer(outletMarker);
            }

            outletMarker = L.marker([lat, lng], {icon: redPinIcon}).addTo(map);

            if (backend) {
                backend.receiveOutletCoords(lat, lng);
            }
        });

        // 6. Fungsi untuk menaruh marker otomatis dari Load KML / KMZ
        function setOutletMarker(lat, lng) {
            if (outletMarker !== null) {
                map.removeLayer(outletMarker);
            }
            outletMarker = L.marker([lat, lng], {icon: redPinIcon}).addTo(map);
            map.setView([lat, lng], 15);
        }

        // 7. Fungsi untuk Menampilkan Kotak Batas DEM di Peta
        function loadDemBounds(geojson_data) {
            try {
                if (demBoundsLayer !== null) {
                    map.removeLayer(demBoundsLayer);
                }

                demBoundsLayer = L.geoJSON(geojson_data, {
                    style: {
                        color: "#ff7800",      // Garis oranye
                        weight: 2,
                        opacity: 0.8,
                        fillColor: "#ff7800",
                        fillOpacity: 0.15     // Transparan agar peta latar tetap terlihat
                    }
                }).addTo(map);

                if (demBoundsLayer.getBounds().isValid()) {
                    map.fitBounds(demBoundsLayer.getBounds());
                }
                console.log("Kotak batas DEM berhasil dimuat ke peta.");
            } catch (e) {
                console.error("Error loading DEM bounds:", e);
            }
        }

        // 8. Fungsi Load River (Garis Sungai Biru)
        function loadRiver(geojsonStr) {
            try {
                var data = JSON.parse(geojsonStr);
                riverLayerGroup.clearLayers();

                var geoJsonLayer = L.geoJSON(data, {
                    style: {
                        color: "#0066ff",
                        weight: 2,
                        opacity: 1
                    }
                });

                riverLayerGroup.addLayer(geoJsonLayer);
                
                if (geoJsonLayer.getBounds().isValid()) {
                    map.fitBounds(geoJsonLayer.getBounds());
                }
            } catch (e) {
                console.error("Error loading river:", e);
            }
        }

        function addRiver(geojsonStr) {
            try {
                var data = JSON.parse(geojsonStr);
                var geoJsonLayer = L.geoJSON(data, {
                    style: {
                        color: "#0066ff",
                        weight: 1,
                        fillColor: "#0066ff",
                        fillOpacity: 0.5
                    }
                });
                riverLayerGroup.addLayer(geoJsonLayer);
            } catch (e) {
                console.error("Error adding river polygon:", e);
            }
        }

        // 9. Fungsi Load Watershed Poligon ke Peta
        function loadWatershed(data) {
            try {
                watershedLayerGroup.clearLayers();

                var watershedLayer = L.geoJSON(data, {
                    style: {
                        color: "#2e7d32",
                        weight: 2,
                        fillColor: "#4caf50",
                        fillOpacity: 0.4
                    },
                    onEachFeature: function (feature, layer) {
                        layer.bindPopup("<b>Catchment Area (Watershed)</b><br>Status: Berhasil Delineasi");
                        layer.on('click', function() {
                            layer.openPopup();
                        });
                    }
                });

                watershedLayerGroup.addLayer(watershedLayer);
                
                if (watershedLayer.getBounds().isValid()) {
                    map.fitBounds(watershedLayer.getBounds());
                }
                console.log("Watershed polygon loaded successfully to map");
            } catch (e) {
                console.error("Error loading watershed polygon:", e);
            }
        }
    </script>
</body>

</html>
