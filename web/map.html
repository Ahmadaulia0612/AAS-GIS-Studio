<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AAS GIS Studio Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- QWebChannel JS -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

    <script>
        var map = L.map('map').setView([0.5, 110.0], 8);

        // Basemap OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var demBoundsLayer = null;
        var riverLayer = null;
        var watershedLayer = null;
        var outletMarker = null;
        var candidatesLayer = null;

        // Inisialisasi QWebChannel untuk komunikasi dengan Python (BrowserPage)
        new QWebChannel(qt.webChannelTransport, function (channel) {
            window.backend = channel.objects.backend;
        });

        // Event Klik Peta untuk memilih Titik Outlet
        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            if (outletMarker) {
                map.removeLayer(outletMarker);
            }

            outletMarker = L.marker([lat, lng]).addTo(map)
                .bindPopup("Outlet Terpilih<br>Lat: " + lat.toFixed(5) + "<br>Lng: " + lng.toFixed(5))
                .openPopup();

            // Kirim koordinat ke backend Python
            if (window.backend && window.backend.receiveOutletCoords) {
                window.backend.receiveOutletCoords(lat, lng);
            }
        });

        // 1. Fungsi Load DEM Bounds & Zoom Otomatis (Fit Bounds)
        function loadDemBounds(geojson_data) {
            if (demBoundsLayer) {
                map.removeLayer(demBoundsLayer);
            }

            demBoundsLayer = L.geoJSON(geojson_data, {
                style: {
                    color: "#ff7800",
                    weight: 2,
                    opacity: 0.65,
                    fillOpacity: 0.1
                }
            }).addTo(map);
        }

        function fitDemBounds(southWest, northEast) {
            var bounds = L.latLngBounds(southWest, northEast);
            map.fitBounds(bounds, { padding: [30, 30] });
        }

        // 2. Fungsi Load River
        function loadRiver(geojson_data) {
            if (riverLayer) {
                map.removeLayer(riverLayer);
            }
            riverLayer = L.geoJSON(geojson_data, {
                style: { color: "blue", weight: 1.5 }
            }).addTo(map);
        }

        function addRiver(geojson_data) {
            if (riverLayer) {
                map.removeLayer(riverLayer);
            }
            riverLayer = L.geoJSON(geojson_data, {
                style: { color: "blue", weight: 1.5 }
            }).addTo(map);
        }

        // 3. Fungsi Set Outlet Marker dari KML
        function setOutletMarker(lat, lng) {
            if (outletMarker) {
                map.removeLayer(outletMarker);
            }
            outletMarker = L.marker([lat, lng]).addTo(map)
                .bindPopup("Outlet KML<br>Lat: " + lat.toFixed(5) + "<br>Lng: " + lng.toFixed(5))
                .openPopup();
            map.setView([lat, lng], 13);
        }

        // 4. Fungsi Load Watershed
        function loadWatershed(geojson_data) {
            if (watershedLayer) {
                map.removeLayer(watershedLayer);
            }
            watershedLayer = L.geoJSON(geojson_data, {
                style: {
                    color: "#d9534f",
                    weight: 2,
                    fillColor: "#f0ad4e",
                    fillOpacity: 0.4
                }
            }).addTo(map);
            map.fitBounds(watershedLayer.getBounds());
        }

        // 5. Fungsi Load Candidates Hydropower
        function loadCandidates(geojson_data) {
            if (candidatesLayer) {
                map.removeLayer(candidatesLayer);
            }
            candidatesLayer = L.geoJSON(geojson_data, {
                pointToLayer: function (feature, latlng) {
                    return L.circleMarker(latlng, {
                        radius: 7,
                        fillColor: "#ff7800",
                        color: "#000",
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.9
                    });
                },
                onEachFeature: function (feature, layer) {
                    if (feature.properties) {
                        var p = feature.properties;
                        var popupContent = `<b>Kandidat Hydropower</b><br>` +
                                           `Rank: ${p.rank || '-'}<br>` +
                                           `Daya: ${p.power_mw || p.power || '-'} MW<br>` +
                                           `Head: ${p.head_m || '-'} m<br>` +
                                           `Catchment Area: ${p.ca_km2 || '-'} km²<br>` +
                                           `Debit: ${p.debit_m3s || '-'} m³/s`;
                        layer.bindPopup(popupContent);
                    }
                }
            }).addTo(map);
        }
    </script>
</body>
</html>
